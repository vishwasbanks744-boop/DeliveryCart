<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            padding: 20px;
        }

        main {
            width: 100%;
            max-width: 440px;
        }

        section {
            background: #ffffff;

            padding: 40px 35px;

            border-radius: 24px;

            box-shadow:
                0 15px 35px rgba(139, 94, 60, 0.15);

            text-align: center;

            transition: transform 0.3s ease;
        }

        section:hover {
            transform: translateY(-5px);
        }


        /* Header */

        header {
            margin-bottom: 25px;
        }

        header img {
            margin-bottom: 12px;
            object-fit: contain;
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #2c1810;
        }


        /* Form */

        form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .field-error {
            display: block;
            min-height: 0;
            margin-top: 4px;
            color: #c62828;
            font-size: 12px;
        }

        .field-error:empty { display: none; }

        .verification-note {
            margin: -2px 0 14px;
            text-align: center;
            color: #6b584c;
            font-size: 13px;
        }

        label {
            display: inline-block;

            font-size: 14px;
            font-weight: 600;

            color: #4a3728;

            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {

            width: 100%;

            padding: 13px 16px;

            font-size: 15px;

            border: 2px solid #eadeb8;

            border-radius: 12px;

            outline: none;

            background-color: #faf8f5;

            color: #2c1810;

            transition: all 0.25s ease;
        }

        input:focus {

            border-color: #ff6b35;

            background-color: #ffffff;

            box-shadow:
                0 0 0 4px rgba(255, 107, 53, 0.15);
        }


        /* Terms */

        .terms {
            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin-bottom: 20px;
        }

        .terms input[type="checkbox"] {

            width: 16px;
            height: 16px;

            accent-color: #ff6b35;

            cursor: pointer;

            margin-top: 2px;
        }

        .terms label {

            margin: 0;

            font-size: 13px;

            font-weight: 400;

            line-height: 1.5;
        }


        /* Links */

        a {
            color: #ff6b35;

            text-decoration: none;

            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }


        /* Button */

        button[type="submit"] {

            width: 100%;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    #ff6b35 0%,
                    #e84a0c 100%
                );

            color: white;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 6px 16px rgba(232, 74, 12, 0.3);

            transition: all 0.25s ease;
        }

        button[type="submit"]:hover {

            filter: brightness(1.05);

            box-shadow:
                0 8px 20px rgba(232, 74, 12, 0.4);
        }

        button[type="submit"]:disabled {

            background: #bdbdbd;
            box-shadow: none;
            opacity: 1;

            cursor: not-allowed;
        }


        /* Message */

        #registerMessage {

            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }

        #registerMessage.auth-response {
            padding: 8px 10px;
            border-radius: 6px;
        }

        #registerMessage.auth-response.success-message {
            color: #17833d;
            background: #e8f5e9;
        }

        #registerMessage.auth-response.error-message {
            color: #c62828;
            background: #ffebee;
        }


        /* Footer */

        footer {

            margin-top: 15px;

            padding-top: 20px;

            border-top: 1px dashed #eadeb8;

            text-align: center;
        }

        footer p {

            font-size: 14px;

            color: #6b584c;
        }


        /* Mobile */

        @media (max-width: 500px) {

            section {
                padding: 30px 22px;
            }

            header h1 {
                font-size: 23px;
            }

            input:not([type="checkbox"]):not([type="radio"]), select, textarea { min-height: 46px; font-size: 16px; }
            button { min-height: 44px; }
            label { font-size: 15px; }
            footer p { line-height: 1.5; }

        }

    </style>

    <script src="/static/js/auth-client.js"></script>
</head>


<body>


    <main>

        <section>


            <header>

                <a href="/" aria-label="Ramjicart home"><img src="/static/logo%20(2).png" alt="Ramjicart logo" style="width:82px;height:82px"></a>
                <h1>
                    Register here
                </h1>

            </header>



            <!-- Registration Form -->

            <form id="registrationForm" novalidate>

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Full Name" autocomplete="name" required maxlength="150">
                    <small class="field-error" id="fullnameError" aria-live="polite"></small>
                </div>



                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Email Address" required autocomplete="email">
                    <small class="field-error" id="emailError" aria-live="polite"></small>
                </div>



                <div class="form-group">
                    <label for="mobile">Mobile No.</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="Mobile No." required autocomplete="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}">
                    <small class="field-error" id="mobileError" aria-live="polite"></small>
                </div>

                <div class="form-group">
                    <label for="pincode">Pin code</label>
                    <input type="text" id="pincode" name="pincode" placeholder="6-digit Pin code" required inputmode="numeric" autocomplete="postal-code" maxlength="6" pattern="[0-9]{6}">
                    <small class="field-error" id="pincodeError" aria-live="polite"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required autocomplete="new-password" minlength="8">
                    <small class="field-error" id="passwordError" aria-live="polite"></small>
                </div>



                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password">
                    <small class="field-error" id="confirmPasswordError" aria-live="polite"></small>
                </div>

                <p class="verification-note">Firstly verify with Google, then Register</p>
                <button type="button" id="googleRegisterButton" style="width:100%;padding:12px;margin-bottom:18px;background:#fff;color:#222;border:1px solid #bbb;border-radius:8px;cursor:pointer">
                    Verify with Google
                </button>

                <!-- Registration Button -->

                <div>

                    <button
                        type="submit"
                        id="registerButton">

                        Register

                    </button>

                </div>


                <p id="registerMessage"></p>


            </form>



            <!-- Footer -->

            <footer>

                <p class="legal-links">
                    By registering, you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.
                </p>

                <p>

                    Already have an account?

                    <a href="login.html">
                        Log In
                    </a>

                </p>

            </footer>


        </section>

    </main>



    <script>
        const registrationForm = document.getElementById("registrationForm");
        const registerButton = document.getElementById("registerButton");
        const googleButton = document.getElementById("googleRegisterButton");
        const message = document.getElementById("registerMessage");
        const fields = ["fullname", "email", "mobile", "pincode", "password", "confirmPassword"];
        let googleRegistrationIdentity = null;
        let submitting = false;

        function validateField(id) {
            const input = document.getElementById(id);
            const value = input.value.trim();
            let error = "";
            if (!value) error = "This field is required.";
            else if (id === "fullname" && value.length > 150) error = "Name must be 150 characters or fewer.";
            else if (id === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) error = "Enter a valid email address.";
            else if (id === "mobile" && !/^\d{10}$/.test(value)) error = "Mobile number must be exactly 10 digits.";
            else if (id === "pincode" && !/^\d{6}$/.test(value)) error = "Pin code must be exactly 6 digits.";
            else if (id === "password" && input.value.length < 8) error = "Password must be at least 8 characters.";
            else if (id === "confirmPassword" && input.value !== document.getElementById("password").value) error = "Passwords do not match.";
            if (id === "email" && googleRegistrationIdentity && value.toLowerCase() !== googleRegistrationIdentity.email.toLowerCase()) {
                error = "Try again";
            }
            document.getElementById(id + "Error").textContent = error;
            input.setAttribute("aria-invalid", error ? "true" : "false");
            return !error;
        }

        function updateFormState() {
            const valid = fields.map(validateField).every(Boolean);
            registerButton.disabled = submitting || !valid || !googleRegistrationIdentity;
        }

        fields.forEach(function(id) {
            document.getElementById(id).addEventListener("input", function() {
                if (googleRegistrationIdentity) {
                    googleRegistrationIdentity = null;
                    googleButton.textContent = "Verify with Google";
                    googleButton.style.color = "#222";
                    message.textContent = "";
                    message.className = "";
                }
                updateFormState();
            });
        });
        updateFormState();

        googleButton.addEventListener("click", async function() {
            googleButton.disabled = true;
            message.textContent = "";
            message.className = "";
            try {
                const identity = await RamjicartAuth.startGoogleSignIn();
                googleRegistrationIdentity = identity;
                if (document.getElementById("email").value.trim().toLowerCase() !== identity.email.toLowerCase()) {
                    googleRegistrationIdentity = identity;
                    validateField("email");
                    message.textContent = "Try again";
                    message.className = "auth-response error-message";
                    googleButton.textContent = "Verify with Google";
                } else {
                    googleButton.textContent = "\u2713 Verified";
                    googleButton.style.color = "#17833d";
                }
                updateFormState();
            } catch (error) {
                console.error("Google registration verification failed:", error);
                googleRegistrationIdentity = null;
                message.textContent = "Try again";
                message.className = "auth-response error-message";
                updateFormState();
            } finally {
                googleButton.disabled = false;
            }
        });

        registrationForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            updateFormState();
            if (registerButton.disabled) return;
            submitting = true;
            updateFormState();
            registerButton.textContent = "Registering...";
            message.textContent = "";
            message.className = "";
            try {
                const response = await RamjicartAuth.registerCustomer({
                    fullname: document.getElementById("fullname").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    mobile: document.getElementById("mobile").value.trim(),
                    pincode: document.getElementById("pincode").value.trim(),
                    password: document.getElementById("password").value
                }, googleRegistrationIdentity);
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Registration failed.");
                message.textContent = data.message || "Login successful";
                message.className = "auth-response success-message";
                if (data.redirect) setTimeout(function() { window.location.href = data.redirect; }, 600);
            } catch (error) {
                console.error("Registration failed:", error);
                message.textContent = "Try again";
                message.className = "auth-response error-message";
            } finally {
                submitting = false;
                registerButton.textContent = "Register";
                updateFormState();
            }
        });
    </script>


</body>

</html>
