<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        form {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(139, 94, 60, 0.15);
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        form:hover {
            transform: translateY(-5px);
        }

        form::before {
            content: "Welcome Back!";
            display: block;
            font-size: 26px;
            font-weight: 700;
            color: #2c1810;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        .site-logo {
            display: block;
            width: 82px;
            height: 82px;
            margin: 0 auto 18px;
            object-fit: contain;
        }

        label {
            display: inline-block;
            font-size: 14px;
            font-weight: 600;
            color: #4a3728;
            margin-bottom: 6px;
            margin-left: 2px;
            text-transform: capitalize;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            font-size: 15px;
            border: 2px solid #eadeb8;
            border-radius: 12px;
            outline: none;
            background-color: #faf8f5;
            color: #2c1810;
            transition: all 0.25s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #ff6b35;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15);
        }

        ::placeholder {
            color: #a89f91;
            font-size: 14px;
        }

        a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
            display: inline-block;
        }

        a:hover {
            color: #d14914;
            text-decoration: underline;
        }

        .forgot-password {
            font-size: 13px;
            float: right;
            margin-top: -8px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b35 0%, #e84a0c 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(232, 74, 12, 0.3);
            text-transform: capitalize;
            transition: all 0.25s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(232, 74, 12, 0.4);
            filter: brightness(1.05);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .registration-link {
            text-align: center;
            margin-top: 5px;
        }

        .registration-link a {
            border-top: 1px dashed #eadeb8;
            width: 100%;
            padding-top: 15px;
            margin-top: 5px;
            display: block;
        }

        #loginMessage {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        .error-message {
            color: #d93025;
        }

        .success-message {
            color: #188038;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            form { padding: 26px 18px; }
            input[type="email"], input[type="password"] { min-height: 48px; font-size: 16px; }
            button[type="submit"] { min-height: 48px; }
            label, a { font-size: 15px; }
            .forgot-password, #loginMessage { font-size: 14px; }
        }
    </style>
    <script src="/static/js/auth-client.js"></script>
</head>

<body>

    <form id="loginForm">

        <a href="/" aria-label="Ramjicart home"><img class="site-logo" src="/static/logo%20(2).png" alt="Ramjicart logo"></a>
        <div>
            <label for="loginemail">gmail</label><br>
            <input
                type="email"
                id="loginemail"
                name="email"
                placeholder="enter your gmail"
                required
            >
        </div>

        <br>

        <div>
            <label for="loginpassword">password</label><br>
            <input
                type="password"
                id="loginpassword"
                name="password"
                placeholder="enter your password"
                autocomplete="off"
                required
            >
        </div>

        <br>

        <div>
            <a href="#" class="forgot-password">
                forgot password
            </a>
        </div>

        <br>

        <div>
            <button type="submit" id="loginButton">
                submit
            </button>
        </div>

        <div>
            <button type="button" id="googleLoginButton" style="width:100%;margin-top:12px;padding:11px;background:#fff;color:#222;border:1px solid #bbb;border-radius:6px;cursor:pointer">
                Continue with Google
            </button>
        </div>

        <div id="loginMessage"></div>

        <br>

        <div class="registration-link">
            <a href="register.html">
                registration here
            </a>
            <p><a href="deliveryregister.html">Delivery partner registration</a></p>
        </div>

    </form>

    <script>

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const loginMessage = document.getElementById("loginMessage");
        const googleLoginButton = document.getElementById("googleLoginButton");
        document.querySelector(".forgot-password").addEventListener("click", async function(event) {
            event.preventDefault();
            const email = document.getElementById("loginemail").value.trim();
            if (!email) {
                loginMessage.textContent = "Enter your Gmail address first.";
                loginMessage.className = "error-message";
                return;
            }
            try {
                await RamjicartAuth.sendPasswordResetEmail(email);
                loginMessage.textContent = "Password reset email sent. Check your inbox.";
                loginMessage.className = "success-message";
            } catch (error) {
                loginMessage.textContent = error.message || "Could not send a reset email.";
                loginMessage.className = "error-message";
            }
        });

        googleLoginButton.addEventListener("click", async function() {
            googleLoginButton.disabled = true;
            loginMessage.textContent = "Signing in with Google...";
            try {
                const response = await RamjicartAuth.loginWithGoogle("customer");
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Google sign-in failed.");
                loginMessage.textContent = data.message || "Login successful.";
                window.setTimeout(function() {
                    window.location.href = data.redirect || "/";
                }, 400);
            } catch (error) {
                loginMessage.textContent = error.message || "Google sign-in failed.";
            } finally {
                googleLoginButton.disabled = false;
            }
        });

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("loginemail").value.trim();
            const password = document.getElementById("loginpassword").value;

            loginMessage.textContent = "";
            loginMessage.className = "";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {

                const response = await RamjicartAuth.login({
                    email: email,
                    password: password,
                    expectedRole: "customer"
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed");
                }

                loginMessage.textContent =
                    data.message || "Login successful";

                loginMessage.className = "success-message";

                /*
                 * Backend agar redirect bheje
                 * to wahi page open hoga.
                 * Nahi to customer home page open hoga.
                 */
                setTimeout(function() {

                    if (data.redirect) {
                        window.location.href = data.redirect;
                    } else {
                        window.location.href = "/";
                    }

                }, 700);

            } catch (error) {

                loginMessage.textContent =
                    error.message || "Something went wrong";

                loginMessage.className = "error-message";

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "submit";
            }

        });

    </script>

</body>
</html>
