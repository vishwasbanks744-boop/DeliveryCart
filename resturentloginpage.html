    <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ramjicart - Login</title>


    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }


        /* =========================
           LOGIN PAGE
        ========================= */

        .login-page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }


        /* =========================
           LOGIN CONTAINER
        ========================= */

        .login-container {
            width: 100%;
            max-width: 430px;

            background: #ffffff;

            padding: 40px;

            border-radius: 14px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);

            text-align: center;
        }


        /* =========================
           BRAND
        ========================= */

        .login-container h1 {
            color: #ff5a16;

            font-size: 32px;

            margin-bottom: 25px;
        }


        /* =========================
           LOGIN HEADING
        ========================= */

        .login-container h2 {
            color: #222222;

            font-size: 26px;

            margin-bottom: 10px;
        }


        .login-container > p {
            color: #777777;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* =========================
           FORM
        ========================= */

        #loginForm {
            text-align: left;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            color: #333333;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        /* =========================
           INPUT
        ========================= */

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dddddd;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }


        .form-group input:focus {
            border-color: #ff5a16;

            box-shadow: 0 0 0 3px rgba(255, 90, 22, 0.10);
        }


        .form-group input::placeholder {
            color: #aaaaaa;
        }


        /* =========================
           FORGOT PASSWORD
        ========================= */

        #forgotPassword {
            display: block;

            width: fit-content;

            margin-left: auto;

            margin-bottom: 22px;

            color: #ff5a16;

            font-size: 14px;

            text-decoration: none;
        }


        #forgotPassword:hover {
            text-decoration: underline;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        #loginButton {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #ff5a16;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        #loginButton:hover {
            background: #e94e0c;
        }


        #loginButton:active {
            transform: scale(0.98);
        }


        /* =========================
           LOGIN MESSAGE
        ========================= */

        #loginMessage {
            min-height: 20px;

            margin-top: 15px;

            font-size: 14px;

            text-align: center;
        }


        /* =========================
           REGISTRATION
        ========================= */

        .login-container form + p {
            margin-top: 25px;

            color: #777777;

            font-size: 14px;
        }


        .login-container form + p a {
            color: #ff5a16;

            text-decoration: none;

            font-weight: 600;
        }


        .login-container form + p a:hover {
            text-decoration: underline;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .login-container {
                padding: 30px 22px;
            }


            .login-container h1 {
                font-size: 28px;
            }


            .login-container h2 {
                font-size: 23px;
            }

        }

    </style>

</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <h1><img src="/static/logo%20(2).png" alt="Ramjicart logo" style="width:52px;height:52px;object-fit:contain;vertical-align:middle"> Ramjicart</h1>

            <h2>Login</h2>

            <p>Login to your account</p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>


                <p id="loginMessage"></p>

            </form>


            <p>
                Don't have an account?
                <a href="resturentregisterpage.html">
                    Register here
                </a>
                <p><a href="deliveryregister.html">Delivery partner registration</a></p>
            </p>

        </div>

    </main>
    <script>

    const loginForm = document.getElementById("loginForm");

    const loginEmail = document.getElementById("loginEmail");

    const loginPassword = document.getElementById("loginPassword");

    const loginButton = document.getElementById("loginButton");

    const loginMessage = document.getElementById("loginMessage");

    const forgotPassword = document.getElementById("forgotPassword");


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();


        const email = loginEmail.value.trim();

        const password = loginPassword.value;


        if (!email || !password) {

            loginMessage.textContent = "Please enter email and password.";

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent = "Logging in...";

        loginMessage.textContent = "";


        try {

            const response = await fetch("/api/auth/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": (document.cookie
                        .split("; ")
                        .find(function(cookie) {
                            return cookie.startsWith("csrftoken=");
                        }) || "csrftoken=").split("=").slice(1).join("=")
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })

            });


            const data = await response.json();


            if (response.ok) {

                loginMessage.textContent =
                    data.message || "Login successful!";


                /*
                    Backend agar token bhejta hai
                    to yahan save kar sakte hain.
                */

                if (data.token) {

                    localStorage.setItem(
                        "authToken",
                        data.token
                    );

                }


                /*
                    Backend login successful hone ke
                    baad dashboard par bhej sakta hai.
                */

                if (data.redirect) {

                    window.location.href = data.redirect;

                } else {

                    window.location.href = "resturenthomepage.html";

                }

            } else {

                loginMessage.textContent =
                    data.message || "Invalid email or password.";

            }


        } catch (error) {

            console.error("Login error:", error);

            loginMessage.textContent =
                "Something went wrong. Please try again.";

        }


        loginButton.disabled = false;

        loginButton.textContent = "Login";

    });


    /* =========================
       FORGOT PASSWORD
    ========================= */

    forgotPassword.addEventListener("click", function (event) {

        event.preventDefault();

        window.location.href = "forgot-password.html";

    });

</script>

</body>
</html>
