<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ramjicart - Orders</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f7f9;
            color: #222;
        }


        /* ================= HEADER ================= */

        .header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e5e5;

            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 100;
        }

        .header-container {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;
        }

        .main-upperdiv {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .main-upperdiv h1 {
            color: #ff5a16;
            font-size: 24px;
        }

        .main-upperdiv h4 {
            color: #777;
            font-weight: 500;
            border-left: 1px solid #ddd;
            padding-left: 12px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .notification-button {
            border: none;
            background: transparent;
            font-size: 21px;
            cursor: pointer;
            position: relative;
        }

        .notification-count {
            position: absolute;
            top: -7px;
            right: -8px;

            min-width: 18px;
            height: 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #ff5a16;
            color: white;

            border-radius: 50%;
            font-size: 10px;
        }

        .header-divider {
            width: 1px;
            height: 35px;
            background: #ddd;
        }

        .restaurant-account {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .restaurant-logo {
            width: 38px;
            height: 38px;

            border-radius: 50%;
            object-fit: cover;

            background: #eee;
        }

        .resturant-name {
            font-weight: 600;
        }

        .restaurant-arrow {
            color: #777;
        }


        /* ================= MAIN ================= */

        .orders-page {
            padding: 105px 30px 40px;
        }


        /* ================= PAGE HEADER ================= */

        .orders-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 28px;
        }

        .orders-page-header h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .orders-page-header p {
            color: #777;
            font-size: 14px;
        }


        /* ================= STATS ================= */

        .order-stats {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: white;

            border: 1px solid #e8e8e8;

            border-radius: 10px;

            padding: 20px;
        }

        .stat-card p {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card h2 {
            font-size: 27px;
        }

        .stat-card:first-child h2 {
            color: #ff5a16;
        }


        /* ================= ORDER SECTION ================= */

        .orders-section {
            background: white;

            border: 1px solid #e8e8e8;

            border-radius: 10px;

            padding: 22px;
        }

        .orders-section-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .orders-section-header h2 {
            font-size: 20px;
        }


        /* ================= FILTERS ================= */

        .order-controls {
            display: flex;

            gap: 12px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .order-search {
            flex: 1;
            min-width: 220px;
        }

        .order-search input,
        .status-filter select {
            width: 100%;

            padding: 11px 13px;

            border: 1px solid #ddd;

            border-radius: 7px;

            outline: none;

            font-size: 14px;
        }

        .order-search input:focus,
        .status-filter select:focus {
            border-color: #ff5a16;
        }

        .status-filter {
            width: 180px;
        }


        /* ================= ORDER LIST ================= */

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {
            border: 1px solid #e5e5e5;

            border-radius: 9px;

            padding: 18px;

            background: #fff;
        }

        .order-card-top {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding-bottom: 15px;

            border-bottom: 1px solid #eee;
        }

        .order-number {
            font-weight: 700;
            font-size: 16px;
        }

        .order-date {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        .order-status {
            padding: 6px 11px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;
        }

        .status-pending {
            background: #fff4d6;
            color: #a06a00;
        }

        .status-confirmed {
            background: #e5f1ff;
            color: #1769aa;
        }

        .status-preparing {
            background: #f0e7ff;
            color: #7141b1;
        }

        .status-ready {
            background: #e2f8eb;
            color: #17833d;
        }

        .status-completed {
            background: #e5e5e5;
            color: #555;
        }

        .status-cancelled {
            background: #ffe5e5;
            color: #c62828;
        }


        /* ================= ORDER DETAILS ================= */

        .order-details {
            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            gap: 20px;

            padding: 18px 0;
        }

        .detail-box span {
            display: block;

            color: #888;

            font-size: 12px;

            margin-bottom: 5px;
        }

        .detail-box strong {
            font-size: 14px;
        }


        /* ================= ORDER ITEMS ================= */

        .order-items {
            border-top: 1px solid #eee;

            border-bottom: 1px solid #eee;

            padding: 15px 0;
        }

        .order-item {
            display: flex;

            justify-content: space-between;

            padding: 6px 0;

            font-size: 14px;
        }

        .order-total {
            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 12px;

            font-weight: 700;
        }


        /* ================= ORDER ACTIONS ================= */

        .order-actions {
            display: flex;

            justify-content: flex-end;

            gap: 9px;

            margin-top: 15px;

            flex-wrap: wrap;
        }

        .order-actions button {
            border: none;

            padding: 9px 14px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 13px;
        }

        .accept-button {
            background: #ff5a16;
            color: white;
        }

        .accept-button:hover {
            background: #e94e0c;
        }

        .cancel-button {
            background: #ffe5e5;
            color: #c62828;
        }

        .view-button {
            background: #f1f1f1;
            color: #444;
        }


        /* ================= EMPTY ================= */

        .no-orders {
            text-align: center;

            padding: 55px 20px;

            display: none;
        }

        .no-orders h3 {
            margin-bottom: 8px;
        }

        .no-orders p {
            color: #888;
            font-size: 14px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .order-stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .order-details {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 700px) {

            .orders-page {
                padding: 100px 15px 30px;
            }

            .main-upperdiv h4,
            .resturant-name {
                display: none;
            }

            .orders-page-header {
                align-items: flex-start;
            }

        }


        @media (max-width: 500px) {

            .order-stats {
                grid-template-columns: 1fr;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .orders-section {
                padding: 15px;
            }

        }

        @media (max-width: 600px) {
            .header { height: auto; min-height: 74px; padding: 10px 14px; }
            .orders-page { padding: 88px 14px calc(22px + env(safe-area-inset-bottom)); }
            .orders-page-header { gap: 12px; flex-wrap: wrap; }
            .order-stats { gap: 10px; }
            .orders-section { padding: 16px; }
            button, .orders-page a[role="button"] { min-height: 44px; }
            input, select, textarea { min-height: 46px; font-size: 16px; }
        }

        @media (max-width: 500px) {
            .order-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 360px) {
            .order-stats { grid-template-columns: 1fr; }
        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-container">

            <div class="main-upperdiv">

                <h1><img src="/static/logo%20(2).png" alt="Ramjicart logo" style="width:48px;height:48px;object-fit:contain;vertical-align:middle"> Ramjicart</h1>

                <h4>Restaurant Panel</h4>

            </div>


            <div class="header-right">

                <button
                    type="button"
                    class="notification-button"
                    id="notificationBtn">

                    🔔

                    <span
                        class="notification-count"
                        id="notificationCount">
                        0
                    </span>

                </button>


                <div class="header-divider"></div>


                <div
                    class="restaurant-account"
                    id="restaurantAccount">

                    <img
                        src=""
                        alt="Restaurant Logo"
                        class="restaurant-logo"
                        id="restaurantLogo">

                    <span
                        class="resturant-name"
                        id="resturant-name">
                    </span>

                    <span class="restaurant-arrow">
                        ⌄
                    </span>

                </div>

            </div>

        </div>

    </header>



    <!-- ================= ORDERS PAGE ================= -->

    <main class="orders-page">


        <!-- PAGE HEADER -->

        <section class="orders-page-header">

            <div>

                <h1>Orders</h1>

                <p>
                    Manage and track your restaurant orders.
                </p>

            </div>

        </section>



        <!-- ================= ORDER STATS ================= -->

        <section class="order-stats">


            <div class="stat-card">

                <p>Total Orders</p>

                <h2 id="totalOrders">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Pending Orders</p>

                <h2 id="pendingOrders">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Completed Orders</p>

                <h2 id="completedOrders">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <p>Today's Orders</p>

                <h2 id="todayOrders">
                    0
                </h2>

            </div>


        </section>



        <!-- ================= ORDERS ================= -->

        <section class="orders-section">


            <div class="orders-section-header">

                <h2>
                    Recent Orders
                </h2>

            </div>



            <!-- FILTER -->

            <div class="order-controls">


                <div class="order-search">

                    <input
                        type="search"
                        id="orderSearch"
                        placeholder="Search order...">

                </div>


                <div class="status-filter">

                    <select id="statusFilter">

                        <option value="all">
                            All Orders
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                        <option value="confirmed">
                            Confirmed
                        </option>

                        <option value="preparing">
                            Preparing
                        </option>

                        <option value="ready">
                            Ready
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


            </div>



            <!-- ORDER LIST -->

            <div
                class="orders-list"
                id="ordersList">
            </div>



            <!-- NO ORDERS -->

            <div
                class="no-orders"
                id="noOrders">

                <h3>
                    No orders found
                </h3>

                <p>
                    New customer orders will appear here.
                </p>

            </div>


        </section>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        let allOrders = [];


        /* =========================
           RESTAURANT DETAILS
        ========================= */

        async function loadRestaurantDetails() {

            try {

                const response = await fetch(
                    "/api/restaurant/profile"
                );

                if (!response.ok) {

                    throw new Error(
                        "Failed to load restaurant"
                    );

                }

                const data = await response.json();


                document.getElementById(
                    "resturant-name"
                ).textContent =
                    data.restaurantName || "";


                document.getElementById(
                    "restaurantLogo"
                ).src =
                    data.logo || "";

            }

            catch (error) {

                console.error(
                    "Restaurant error:",
                    error
                );

            }

        }



        /* =========================
           LOAD ORDERS
        ========================= */

        async function loadOrders() {

            try {

                const response = await fetch(
                    "/api/restaurant/orders"
                );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load orders"
                    );

                }


                const data = await response.json();


                allOrders = data.orders || [];


                updateOrderStats();

                displayOrders(allOrders);

            }

            catch (error) {

                console.error(
                    "Orders error:",
                    error
                );

                allOrders = [];

                updateOrderStats();

                displayOrders([]);

            }

        }



        /* =========================
           ORDER STATS
        ========================= */

        function updateOrderStats() {

            const total =
                allOrders.length;


            const pending =
                allOrders.filter(
                    order =>
                        order.status === "pending"
                ).length;


            const completed =
                allOrders.filter(
                    order =>
                        order.status === "completed"
                ).length;


            const today =
                allOrders.filter(
                    order =>
                        order.isToday === true
                ).length;


            document.getElementById(
                "totalOrders"
            ).textContent = total;


            document.getElementById(
                "pendingOrders"
            ).textContent = pending;


            document.getElementById(
                "completedOrders"
            ).textContent = completed;


            document.getElementById(
                "todayOrders"
            ).textContent = today;

        }



        /* =========================
           DISPLAY ORDERS
        ========================= */

        function displayOrders(orders) {

            const ordersList =
                document.getElementById(
                    "ordersList"
                );


            const noOrders =
                document.getElementById(
                    "noOrders"
                );


            ordersList.innerHTML = "";


            if (!orders.length) {

                noOrders.style.display =
                    "block";

                return;

            }


            noOrders.style.display =
                "none";


            orders.forEach(order => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                const itemsHTML =
                    (order.items || [])
                    .map(item => {

                        return `
                            <div class="order-item">

                                <span>
                                    ${item.quantity} ×
                                    ${item.name}
                                </span>

                                <strong>
                                    ₹${item.price}
                                </strong>

                            </div>
                        `;

                    })
                    .join("");


                card.innerHTML = `

                    <div class="order-card-top">

                        <div>

                            <div class="order-number">
                                Order #${order.orderNumber || ""}
                            </div>

                            <div class="order-date">
                                ${order.date || ""}
                            </div>

                        </div>


                        <span class="order-status status-${order.status || "pending"}">
                            ${order.status || "pending"}
                        </span>

                    </div>


                    <div class="order-details">

                        <div class="detail-box">

                            <span>Order type</span>

                            <strong>${order.orderTypeText || order.orderType || ""}</strong>

                        </div>

                        <div class="detail-box">

                            <span>
                                Customer
                            </span>

                            <strong>
                                ${order.customerName || ""}
                            </strong>

                        </div>


                        <div class="detail-box">

                            <span>
                                Delivery Address
                            </span>

                            <strong>
                                ${order.address || ""}
                            </strong>

                        </div>


                        <div class="detail-box">

                            <span>
                                Payment
                            </span>

                            <strong>
                                ${order.paymentMethod || ""}
                            </strong>

                        </div>

                    </div>


                    <div class="order-items">

                        ${itemsHTML}

                        <div class="order-total">

                            <span>
                                Total:
                            </span>

                            <span>
                                ₹${order.total || 0}
                            </span>

                        </div>

                    </div>


                    <div class="order-actions">

                        ${
                            order.status === "pending"
                            ? `<button type="button" class="accept-button" onclick="updateOrderStatus('${order.id}', 'confirmed')">Accept Order</button>
                               <button type="button" class="cancel-button" onclick="updateOrderStatus('${order.id}', 'cancelled')">Cancel</button>`
                            : ""
                        }

                        ${
                            order.status === "confirmed"
                            ? `<button type="button" class="accept-button" onclick="updateOrderStatus('${order.id}', 'preparing')">Start Preparing</button>`
                            : ""
                        }

                        ${
                            order.status === "preparing"
                            ? `<button type="button" class="accept-button" onclick="updateOrderStatus('${order.id}', 'ready')">Mark Ready</button>`
                            : ""
                        }

                        ${
                            order.status === "ready" && order.orderType === "pickup"
                            ? `<input class="pickup-code" id="pickup-code-${order.id}" inputmode="numeric" maxlength="4" placeholder="Customer's 4-digit code">
                               <button type="button" class="accept-button" onclick="confirmPickup('${order.id}')">Confirm customer pickup</button>`
                            : ""
                        }

                        ${
                            order.status === "ready" && order.orderType === "delivery"
                            ? `<p>Ready. Waiting for a delivery partner to accept.</p>`
                            : ""
                        }


                        <button
                            type="button"
                            class="view-button"
                            onclick="viewOrder('${order.id}')">

                            View Order

                        </button>

                    </div>

                `;


                ordersList.appendChild(card);

            });

        }



        /* =========================
           SEARCH
        ========================= */

        document
            .getElementById("orderSearch")
            .addEventListener(
                "input",
                filterOrders
            );



        /* =========================
           STATUS FILTER
        ========================= */

        document
            .getElementById("statusFilter")
            .addEventListener(
                "change",
                filterOrders
            );



        function filterOrders() {

            const search =
                document
                    .getElementById("orderSearch")
                    .value
                    .toLowerCase();


            const status =
                document
                    .getElementById("statusFilter")
                    .value;


            const filtered =
                allOrders.filter(order => {

                    const matchesSearch =
                        String(
                            order.orderNumber || ""
                        )
                        .toLowerCase()
                        .includes(search);


                    const matchesStatus =
                        status === "all" ||
                        order.status === status;


                    return (
                        matchesSearch &&
                        matchesStatus
                    );

                });


            displayOrders(filtered);

        }



        /* =========================
           UPDATE ORDER STATUS
        ========================= */

        async function updateOrderStatus(
            orderId,
            status
        ) {

            try {

                const response =
                    await fetch(
                        `/api/restaurant/orders/${orderId}`,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "X-CSRFToken": csrfToken()
                            },

                            body: JSON.stringify({
                                status: status
                            })

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Status update failed"
                    );

                }

                await loadOrders();

            }

            catch (error) {

                console.error(
                    "Status error:",
                    error
                );

            }

        }

        function csrfToken() {
            const cookie = document.cookie.split("; ")
                .find(value => value.startsWith("csrftoken="));
            return cookie ? decodeURIComponent(cookie.split("=")[1]) : "";
        }

        async function confirmPickup(orderId) {
            const code = document.getElementById("pickup-code-" + orderId).value.trim();
            const response = await fetch(
                `/api/restaurant/orders/${orderId}/confirm-pickup`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken()
                    },
                    body: JSON.stringify({ confirmationCode: code })
                }
            );
            const data = await response.json();
            if (!response.ok) {
                alert(data.message || "Pickup confirmation failed.");
                return;
            }
            alert(data.message);
            await loadOrders();
        }



        /* =========================
           VIEW ORDER
        ========================= */

        function viewOrder(orderId) {

            window.location.href =
                `order-details.html?id=${orderId}`;

        }



        /* =========================
           NOTIFICATIONS
        ========================= */

        document
            .getElementById("notificationBtn")
            .addEventListener(
                "click",
                function () {

                    window.location.href =
                        "notifications.html";

                }
            );



        /* =========================
           START
        ========================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadRestaurantDetails();

                loadOrders();

            }
        );

        window.setInterval(loadOrders, 15000);

    </script>

</body>

</html>
