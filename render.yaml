services:
  - type: web
    name: ramjicart
    runtime: python
    plan: starter
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn ramjicart.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: ramjicart-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ramjicart-db
          property: connectionString

  - type: cron
    name: ramjicart-order-watchdog
    runtime: python
    plan: starter
    schedule: "*/1 * * * *"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python manage.py process_restaurant_orders
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ramjicart-db
          property: connectionString

databases:
  - name: ramjicart-db
    plan: basic-256mb
    databaseName: ramjicart
    user: ramjicart
