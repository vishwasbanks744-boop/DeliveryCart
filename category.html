<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Shop {{ category.name }} from nearby Ramjicart stores.">
  <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}/category/{{ category.slug }}">
  <title>{{ category.name }} shops &amp; products | Ramjicart</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#20252b;font:15px Arial,sans-serif}header{background:#fff;padding:15px max(18px,calc((100% - 1120px)/2));box-shadow:0 2px 10px #17212b0d;position:sticky;top:0;z-index:3}header a{color:#f04b32;text-decoration:none;font-weight:700}.wrap{max-width:1120px;margin:auto;padding:26px 18px}.crumb{color:#78818b;font-size:13px}.crumb a{color:#66717c}.hero{display:flex;align-items:center;gap:14px;margin:20px 0}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:#77818c}.hero-icon{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:34px}.tabs{display:flex;gap:9px;overflow:auto;padding:4px 0 15px;margin-bottom:10px;scrollbar-width:thin}.tabs a{white-space:nowrap;text-decoration:none;color:#424a53;background:white;border:1px solid #e8eaed;border-radius:99px;padding:10px 14px;font-weight:600}.tabs a.active{background:#ffede8;color:#d8432c;border-color:#ffd2c6}.filters{display:grid;grid-template-columns:minmax(200px,1fr) repeat(4,minmax(130px,170px));gap:10px;margin:12px 0 20px}.filters input,.filters select{width:100%;padding:12px;border:1px solid #dfe3e8;border-radius:10px;background:white;font-size:14px}.shop{background:white;border:1px solid #eceef1;border-radius:16px;margin:14px 0;overflow:hidden}.shop-head{display:flex;align-items:center;gap:13px;padding:16px;cursor:pointer}.shop-head img{width:58px;height:58px;object-fit:cover;border-radius:13px;background:#f0f2f4}.shop-meta{flex:1}.shop-meta h2{font-size:18px;margin:0 0 6px}.sub{color:#77818c;font-size:13px}.status{font-size:12px;font-weight:700;padding:6px 9px;border-radius:99px;background:#e9f7ee;color:#22814b}.status.closed{background:#f1f2f4;color:#69727c}.items{border-top:1px solid #f0f1f3;padding:4px 16px}.product{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid #f1f2f4}.product:last-child{border:0}.product img{width:70px;height:70px;border-radius:12px;object-fit:cover;background:#f2f3f4}.product-info{flex:1;min-width:0}.product-info h3{margin:0 0 5px;font-size:15px}.product-info p{margin:0 0 5px;color:#77818c;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-weight:700}.add{border:1px solid #f04b32;background:white;color:#d8432c;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.empty,.loading{padding:28px;text-align:center;background:white;border-radius:14px;color:#69727c}.skeleton{height:104px;margin:12px 0;border-radius:14px;background:linear-gradient(90deg,#eee 25%,#f8f8f8 40%,#eee 60%);background-size:300% 100%;animation:shimmer 1.3s infinite}@keyframes shimmer{to{background-position:-150% 0}}[hidden]{display:none!important}@media(max-width:700px){.wrap{padding:18px 14px}.hero h1{font-size:25px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.tabs{margin-right:-14px}.shop-head{padding:13px}.items{padding:4px 13px}.product img{width:62px;height:62px}.add{padding:8px 10px}}@media(min-width:701px){.shop-head{padding:18px}}
    @media (max-width: 700px) {
      body { padding-bottom: calc(16px + env(safe-area-inset-bottom)); font-size: 16px; }
      header { padding: 12px 16px; }
      .wrap { padding: 16px; }
      .crumb { font-size: 14px; }
      .hero { gap: 10px; margin: 16px 0; }
      .hero h1 { font-size: 24px; overflow-wrap: anywhere; }
      .hero p { font-size: 15px; }
      .hero-icon { width: 54px; height: 54px; flex: 0 0 54px; font-size: 30px; }
      .tabs { margin-right: -16px; padding-right: 16px; }
      .tabs a { min-height: 44px; display: inline-flex; align-items: center; padding: 10px 13px; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .filters input { grid-column: 1 / -1; }
      .filters input, .filters select { min-width: 0; min-height: 46px; padding: 10px; font-size: 16px; }
      .shop-head { min-height: 76px; gap: 10px; padding: 12px; }
      .shop-head img { width: 54px; height: 54px; flex: 0 0 54px; }
      .shop-meta h2 { font-size: 17px; }
      .sub { font-size: 14px; }
      .status { flex: 0 0 auto; font-size: 13px; }
      .items { padding: 4px 12px; }
      .product { gap: 9px; }
      .product img { width: 58px; height: 58px; flex: 0 0 58px; }
      .product-info h3 { font-size: 16px; }
      .product-info p { font-size: 14px; }
      .add { min-width: 82px; min-height: 44px; padding: 8px; }
    }
    .size-picker{display:block;width:100%;max-width:220px;margin-top:8px;padding:9px;border:1px solid #dfe3e8;border-radius:9px;background:#fff;font-size:14px}
  </style>
</head>
<body>
  <header><a href="/">← Ramjicart</a></header>
  <main class="wrap">
    <div class="crumb"><a href="/">Home</a> <span>›</span> <span id="crumbName">{{ category.name }}</span></div>
    <section class="hero"><div id="heroIcon" class="hero-icon" style="background:{{ category.color }}">{{ category.icon }}</div><div><h1 id="title">{{ category.name }}</h1><p>Shops and picks in this category</p></div></section>
    <nav class="tabs" id="tabs" aria-label="Shop categories"></nav>
    <section class="filters" aria-label="Filters"><input id="search" type="search" placeholder="Search shops and items in this category" aria-label="Search this category"><select id="sort"><option value="recommended">Sort: Recommended</option><option value="price">Price: Low to high</option><option value="rating">Rating: High to low</option></select><select id="veg"><option value="all">All items</option><option value="veg">Veg only</option></select><select id="open"><option value="all">Any availability</option><option value="open">Open now</option></select><select id="rating"><option value="all">Any rating</option><option value="4">Rating 4.0+</option></select></section>
    <p id="message" class="loading" aria-live="polite"><span class="skeleton"></span><span class="skeleton"></span></p><section id="shops"></section>
  </main>
  <script>
    const slug=location.pathname.split('/').filter(Boolean).pop(), api='/api/customer/categories/'+encodeURIComponent(slug), fallback=[['Groceries','groceries','🛒','#e8f5e9'],['Fast Food','fast-food','🍔','#fff0e6'],['Drinks & Juice','drinks-juice','🥤','#e8f4ff'],['Fruits','fruits','🍎','#fff1ef'],['Vegetables','vegetables','🥦','#edf7e9'],['Stationery','stationery','✏️','#f1edff'],['Other','other','🧺','#f2f4f7']].map(([name,slug,icon,color],i)=>({id:i+1,name,slug,icon,color}));
    const title=document.querySelector('#title'), shopsEl=document.querySelector('#shops'), message=document.querySelector('#message'), search=document.querySelector('#search'), sort=document.querySelector('#sort'), veg=document.querySelector('#veg'), open=document.querySelector('#open'), rating=document.querySelector('#rating');let data=null;
    function safeImage(url,alt){const img=document.createElement('img');img.loading='lazy';img.alt=alt||'';img.src=url||'/static/food-placeholder.svg';img.onerror=()=>{img.onerror=null;img.src='/static/food-placeholder.svg'};return img}
    function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e}
    function renderTabs(categories,active){const tabs=document.querySelector('#tabs');tabs.innerHTML='';categories.forEach(c=>{const a=make('a',c.slug===active?'active':'',`${c.icon||'🛍️'} ${c.name}`);a.href='/category/'+c.slug;tabs.append(a)});if(categories[0]){const c=categories.find(x=>x.slug===active)||categories[0];document.querySelector('#heroIcon').textContent=c.icon||'🛍️';document.querySelector('#heroIcon').style.background=c.color||'#fff3e8';title.textContent=c.name;document.querySelector('#crumbName').textContent=c.name;document.title=`${c.name} shops & products | Ramjicart`;document.querySelector('meta[name="description"]').content=`Shop ${c.name.toLowerCase()} from nearby Ramjicart stores.`;veg.hidden=!['fast-food'].includes(active)}}
    function render(){if(!data)return;const q=search.value.trim().toLowerCase();let shops=data.shops.map(s=>({...s,items:s.items.filter(i=>(!q||(i.name+' '+(i.description||'')+' '+s.name).toLowerCase().includes(q))&&(veg.value!=='veg'||i.veg))})).filter(s=>s.items.length&& (open.value!=='open'||s.open) && (rating.value==='all'||Number(s.rating)>=Number(rating.value)));if(sort.value==='price')shops.forEach(s=>s.items.sort((a,b)=>a.price-b.price));if(sort.value==='rating')shops.sort((a,b)=>(b.rating||0)-(a.rating||0));shopsEl.innerHTML='';if(!shops.length){message.hidden=false;message.className='empty';message.textContent='Abhi is category mein koi shop nahi hai';return}message.hidden=true;shops.forEach(s=>{const card=make('article','shop'),head=make('div','shop-head');head.append(safeImage(s.photo,s.name));const meta=make('div','shop-meta');meta.append(make('h2','',s.name),make('div','sub',`${s.rating?`★ ${s.rating} · `:''}${s.deliveryTime||'30–45 min'} delivery`));head.append(meta,make('span','status'+(s.open?'':' closed'),s.open?'Open':'Closed'));const items=make('div','items');s.items.forEach(i=>{const row=make('article','product');row.append(safeImage(i.photo,i.name));const info=make('div','product-info');info.append(make('h3','',''+i.name),make('p','',i.description||''));let picker=null;if(i.variants&&i.variants.length){picker=make('select','size-picker');picker.setAttribute('aria-label','Choose how much to buy');i.variants.forEach((v,index)=>{const option=document.createElement('option');option.value=v.name;option.textContent=`${v.name} — ₹${Number(v.price).toFixed(2)}`;picker.append(option)});info.append(picker)}else if(i.quantityUnit==='kg'){const qty=make('input','size-picker');qty.type='number';qty.min='0.05';qty.step='0.01';qty.value='1';qty.setAttribute('aria-label','Aapko kitna chahiye? kg');const unit=make('select','size-picker');[['kg',1],['g',0.001]].forEach(([label,factor])=>{const opt=document.createElement('option');opt.value=factor;opt.textContent=label;unit.append(opt)});const live=make('p','price',String.fromCharCode(8377)+Number(i.price).toFixed(2));qty.addEventListener('input',()=>{live.textContent=String.fromCharCode(8377)+(Math.round(Number(i.price)*Number(qty.value||0)*Number(unit.value)*100)/100).toFixed(2);row.dataset.qty=String(Number(qty.value)*Number(unit.value))});unit.addEventListener('change',()=>live.textContent=String.fromCharCode(8377)+(Math.round(Number(i.price)*Number(qty.value||0)*Number(unit.value)*100)/100).toFixed(2));info.append(make('p','','Aapko kitna chahiye?'),qty,unit,live);const quick=make('div','quick-quantities');[[250,'g'],[500,'g'],[1,'kg'],[2,'kg']].forEach(([amount,label])=>{const b=make('button','add',amount+' '+label);b.type='button';b.addEventListener('click',()=>{qty.value=amount;unit.value=label==='g'?'0.001':'1';qty.dispatchEvent(new Event('input'))});quick.append(b)});info.append(quick);row.dataset.qty='1';unit.addEventListener('change',()=>{qty.min=unit.value==='0.001'?'50':'0.05';qty.step=unit.value==='0.001'?'1':'0.01';live.textContent=String.fromCharCode(8377)+(Math.round(Number(i.price)*Number(qty.value||0)*Number(unit.value)*100)/100).toFixed(2);row.dataset.qty=String(Number(qty.value)*Number(unit.value))})}else info.append(make('span','price',String.fromCharCode(8377)+Number(i.price).toFixed(2)));const add=make('button','add',s.open?'Add to Cart':'Closed');add.type='button';add.disabled=!s.open;add.addEventListener('click',async()=>{add.disabled=true;try{const token=document.cookie.split('; ').find(c=>c.startsWith('csrftoken='));const payload={foodId:i.id,quantity:Number(row.dataset.qty||1)};if(picker)payload.variantName=picker.value;const r=await fetch('/api/customer/cart',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':token?decodeURIComponent(token.split('=')[1]):''},body:JSON.stringify(payload)});const result=await r.json();if(!r.ok)throw new Error(result.message||'Could not add item to cart.');add.textContent='Added ✓';document.dispatchEvent(new CustomEvent('ramjicart:cart-updated',{detail:result}));setTimeout(()=>{add.textContent='Add to Cart';add.disabled=false},1200)}catch(error){add.disabled=false;add.textContent='Try again';if(error.message.toLowerCase().includes('log in')||error.message.toLowerCase().includes('customer'))location.href='/login.html';else alert(error.message)}});row.append(info,add);items.append(row)});head.addEventListener('click',()=>items.hidden=!items.hidden);card.append(head,items);shopsEl.append(card)})}
    async function init(){let categories=fallback;try{const c=await fetch('/api/customer/categories');if(c.ok)categories=await c.json()}catch{}renderTabs(categories,slug);try{const r=await fetch(api);if(!r.ok)throw new Error();data=await r.json();if(!data.shops.length){message.className='empty';message.textContent='Abhi is category mein koi shop nahi hai';return}render()}catch{data={shops:[]};message.className='empty';message.textContent='Abhi is category mein koi shop nahi hai'}search.addEventListener('input',render);sort.addEventListener('change',render);veg.addEventListener('change',render);open.addEventListener('change',render);rating.addEventListener('change',render)}init();
  </script>
</body>
</html>
