<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ramjicart - Restaurant Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .registration-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .registration-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .registration-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .registration-header h1 {
            color: #ff5a16;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .registration-header h2 {
            color: #222;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .registration-header p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ff5a16;
            box-shadow: 0 0 0 3px rgba(255, 90, 22, 0.10);
        }

        #registerButton {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #ff5a16;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        #registerButton:hover {
            background: #e94e0c;
        }

        #registerMessage {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #ff5a16;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .registration-container {
                padding: 25px 20px;
            }

            .registration-header h1 {
                font-size: 28px;
            }

            .registration-header h2 {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>

    <main class="registration-page">

        <div class="registration-container">

            <div class="registration-header">

                <h1><img src="/static/logo%20(2).png" alt="Ramjicart logo" style="width:58px;height:58px;object-fit:contain;vertical-align:middle"> Ramjicart</h1>

                <h2>Restaurant Registration</h2>

                <p>
                    Create your restaurant account
                </p>

            </div>


            <form id="registrationForm">


                <div class="form-group">

                    <label for="restaurantName">
                        Restaurant Name
                    </label>

                    <input
                        type="text"
                        id="restaurantName"
                        name="restaurantName"
                        placeholder="Enter restaurant name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="ownerName">
                        Owner Name
                    </label>

                    <input
                        type="text"
                        id="ownerName"
                        name="ownerName"
                        placeholder="Enter owner name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="restaurantEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="restaurantEmail"
                        name="email"
                        placeholder="Enter restaurant email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="restaurantPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="restaurantPhone"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="restaurantAddress">
                        Restaurant Address
                    </label>

                    <textarea
                        id="restaurantAddress"
                        name="address"
                        placeholder="Enter restaurant address"
                        required
                    ></textarea>

                </div>

                <div class="form-group">
                    <label for="restaurantNearbyLandmark">Nearby Landmark (Optional)</label>
                    <input
                        type="text"
                        id="restaurantNearbyLandmark"
                        maxlength="160"
                        placeholder="e.g. City Hospital"
                    >
                </div>

                <div class="form-group">
                    <label for="restaurantMarket">Market (Optional)</label>
                    <input
                        type="text"
                        id="restaurantMarket"
                        maxlength="160"
                        placeholder="e.g. Hazratganj Market"
                    >
                </div>

                <div class="form-group">
                    <label for="restaurantPincode">6-digit PIN Code</label>
                    <input
                        type="text"
                        id="restaurantPincode"
                        inputmode="numeric"
                        maxlength="6"
                        placeholder="e.g. 226001"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="restaurantCity">City</label>
                    <input
                        type="text"
                        id="restaurantCity"
                        maxlength="100"
                        placeholder="e.g. Lucknow"
                        required
                    >
                </div>


                <div class="form-group">

                    <label for="restaurantPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="restaurantPassword"
                        name="password"
                        placeholder="Create password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="registerButton"
                >
                    Register Restaurant
                </button>


                <p id="registerMessage"></p>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </div>

        </div>

    </main>


    <script>

        const registrationForm =
            document.getElementById("registrationForm");

        const registerButton =
            document.getElementById("registerButton");

        const registerMessage =
            document.getElementById("registerMessage");


        registrationForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const restaurantName =
                    document.getElementById("restaurantName").value.trim();

                const ownerName =
                    document.getElementById("ownerName").value.trim();

                const email =
                    document.getElementById("restaurantEmail").value.trim();

                const phone =
                    document.getElementById("restaurantPhone").value.trim();

                const address =
                    document.getElementById("restaurantAddress").value.trim();

                const nearbyLandmark =
                    document.getElementById("restaurantNearbyLandmark").value.trim();

                const market =
                    document.getElementById("restaurantMarket").value.trim();

                const pincode =
                    document.getElementById("restaurantPincode").value.trim();

                const city =
                    document.getElementById("restaurantCity").value.trim();

                const password =
                    document.getElementById("restaurantPassword").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                if (password !== confirmPassword) {

                    registerMessage.textContent =
                        "Passwords do not match.";

                    return;
                }


                registerButton.disabled = true;

                registerButton.textContent =
                    "Registering...";

                registerMessage.textContent = "";


                try {

                    const response = await fetch(
                        "/api/restaurant/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",
                                "X-CSRFToken": (document.cookie
                                    .split("; ")
                                    .find(function(cookie) {
                                        return cookie.startsWith("csrftoken=");
                                    }) || "csrftoken=").split("=").slice(1).join("=")
                            },

                            body: JSON.stringify({

                                restaurantName: restaurantName,
                                ownerName: ownerName,
                                email: email,
                                phone: phone,
                                address: address,
                                nearbyLandmark: nearbyLandmark,
                                market: market,
                                pincode: pincode,
                                city: city,
                                password: password

                            })
                        }
                    );


                    const data = await response.json();


                    if (response.ok) {

                        registerMessage.textContent =
                            data.message ||
                            "Restaurant registered successfully.";
                        window.setTimeout(function() {
                            window.location.href = data.redirect || "resturentloginpage.html";
                        }, 800);

                    } else {

                        registerMessage.textContent =
                            data.message ||
                            "Registration failed.";

                    }


                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    registerMessage.textContent =
                        "Something went wrong. Please try again.";

                }


                registerButton.disabled = false;

                registerButton.textContent =
                    "Register Restaurant";

            }

        );

    </script>

</body>

</html>
